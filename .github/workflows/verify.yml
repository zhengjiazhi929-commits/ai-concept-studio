name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen install, checks, tests, render and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
        shell: bash
    steps:
      - name: Check out tracked sources only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install exact Python QA runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"

      - name: Scan tracked files for high-confidence secrets
        run: node scripts/scan-tracked-secrets.mjs

      - name: Activate exact pnpm runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Verify runtime versions
        run: |
          node -e 'const fs = require("node:fs"); const expected = `v${fs.readFileSync("../.node-version", "utf8").trim()}`; if (process.version !== expected) { throw new Error(`Node mismatch: expected ${expected}, received ${process.version}`); }'
          test "$(pnpm --version)" = "11.19.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install hash-locked Python QA dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scripts/qa-agent-skill-long-review-wide-v004-requirements.lock.txt
          printf 'QA_PYTHON=%s\n' "$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Block high or critical production dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: Run source, motion, test and fixed render gates
        env:
          CI: "true"
          ACS_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ACS_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ACS_DIFF_FALLBACK_BASE_REF: origin/main
        run: pnpm verify
